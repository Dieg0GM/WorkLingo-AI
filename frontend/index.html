<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkLingo AI</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<div class="app-container">


    <header>

        <h1>🌍 WorkLingo AI</h1>

        <p>Professional AI Communication Assistant</p>

    </header>



   <main class="translator-box">

<div class="mode-selector">

    <label for="mode">
        Mode
    </label>


    <select id="mode">

        <option value="translate">
            🌐 Translate
        </option>


        <option value="assistant">
            ✍ Compose with AI
        </option>


    </select>


</div>

    <div class="translation-card">


        <div class="language-bar">


            <select id="source_language">

                <option value="Spanish">
                    🇪🇸 Spanish
                </option>

                <option value="English">
                    🇺🇸 English
                </option>

                <option value="Japanese">
                    🇯🇵 Japanese
                </option>

            </select>



            <span>⇄</span>



            <select id="target_language">


                <option value="Japanese">
                    🇯🇵 Japanese
                </option>


                <option value="English">
                    🇺🇸 English
                </option>


                <option value="Spanish">
                    🇪🇸 Spanish
                </option>


            </select>


        </div>




        <textarea
            id="text"
            placeholder="Escribe tu mensaje...">
        </textarea>



    </div>


</main>



        <div id="status" class="status">

        </div>



        <div id="result" class="result">

            Translation will appear here...

        </div>




        <div class="advanced">


            <button id="advancedBtn">

                ⚙ Advanced Options ▼

            </button>



            <div id="advancedPanel" class="advanced-panel">


                <label>
                    Channel
                </label>


                <select id="channel">

                    <option value="Slack">
                        Slack
                    </option>

                    <option value="Email">
                        Email
                    </option>

                    <option value="Chat">
                        Chat
                    </option>


                </select>




                <label>
                    Tone
                </label>


                <select id="tone">

                    <option value="Professional">
                        Professional
                    </option>

                    <option value="Friendly">
                        Friendly
                    </option>

                    <option value="Formal">
                        Formal
                    </option>


                </select>


            </div>


        </div>


    </main>


</div>



<script src="/static/js/script.js"></script>


</body>

</html>
